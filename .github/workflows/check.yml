name: Check app

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Browser tests intercept this project's HTTP requests with synthetic fixtures.
  EXPO_PUBLIC_SUPABASE_URL: https://kkywpvkckxniriatelta.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_browser_fixture_only

jobs:
  # Fast feedback: types, lint, unit and script tests.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      # --no-config keeps Deno away from the app's package.json and tsconfig.json.
      # Otherwise it resolves every app dependency, and its 24-hour minimum
      # dependency age fails the check for a day after any version bump.
      - run: deno check --no-config --node-modules-dir=none --no-lock supabase/functions/delete-account/index.ts supabase/functions/tracked-workout/index.ts
      - run: npx expo-doctor
      # Linux can generate the Xcode project without CocoaPods. A free Apple ID
      # (Personal Team) cannot sign the push entitlement, and reminders are local.
      - name: Generate the iOS project and check its entitlements
        run: |
          npx expo prebuild --platform ios --no-install --clean
          entitlements=ios/KineVaultTrack/KineVaultTrack.entitlements
          test -f "$entitlements"
          cat "$entitlements"
          if grep -q "aps-environment" "$entitlements"; then
            echo "::error file=app.json::aps-environment is back in $entitlements. Keep ./plugins/with-local-notifications-only.cjs before expo-notifications."
            exit 1
          fi

  # Bundling for every platform, independent of the browser suite.
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run export:web
      - run: npx expo export --platform ios --platform android --output-dir dist-native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-export
          path: dist
          retention-days: 1

  # Slowest job. Runs alongside the others and reuses the web export.
  browser:
    runs-on: ubuntu-latest
    needs: export
    env:
      KINE_PREVIEW_URL: http://localhost:8082
      KINE_DEV_PREVIEW_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-export
          path: dist
      - run: npx playwright install --with-deps chromium
      - name: Verify app in the browser
        run: |
          trap 'test_status=$?; if [ "$test_status" -ne 0 ]; then cat /tmp/kinevault-expo.log /tmp/kinevault-static.log; fi; exit "$test_status"' EXIT
          # Browse the built app; Metro serves the widget and hardware-Back fixtures.
          npm run web -- --port 8081 > /tmp/kinevault-expo.log 2>&1 &
          npx expo serve --port 8082 > /tmp/kinevault-static.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:8081 > /dev/null && curl --fail --silent http://localhost:8082 > /dev/null; then
              npm run test:browser
              exit $?
            fi
            sleep 1
          done
          cat /tmp/kinevault-expo.log
          exit 1

name: Check app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Browser tests intercept this project's HTTP requests with synthetic fixtures.
      EXPO_PUBLIC_SUPABASE_URL: https://kkywpvkckxniriatelta.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_browser_fixture_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx expo-doctor
      - run: npm run export:web
      - run: npx expo export --platform ios --platform android --output-dir dist-native
      - run: npx playwright install --with-deps chromium
      - name: Verify onboarding in the browser
        run: |
          trap 'test_status=$?; if [ "$test_status" -ne 0 ]; then cat /tmp/kinevault-expo.log; fi; exit "$test_status"' EXIT
          npm run web -- --port 8081 > /tmp/kinevault-expo.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8081 > /dev/null; then
              npm run test:browser
              exit $?
            fi
            sleep 1
          done
          cat /tmp/kinevault-expo.log
          exit 1

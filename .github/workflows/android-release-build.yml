name: Android release build

# Manual only: Actions > Android release build > Run workflow. Builds a signed
# release .apk to install directly on Android phones. See docs/android-apk.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The signing secrets live in this environment, which only runs from main
    # and waits for a reviewer's approval. See docs/android-apk.md.
    environment: android-release
    env:
      # Public client values, compiled into the JavaScript bundle. Shared with
      # the iOS unsigned build.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_TRACK_PARTITIONS: ${{ vars.EXPO_PUBLIC_TRACK_PARTITIONS || 'false' }}
    # The signing secrets go only to the steps below that use them, never to
    # dependency install scripts or prebuild.
    steps:
      # Fail in seconds instead of after a full build.
      - name: Check required configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=0
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. See docs/android-apk.md."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # Generates android/ from app.json and plugins/.
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Build the signed release .apk
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # Android Studio's signing properties replace the template's debug
          # signing. Phone ABIs only; x86 builds run only in emulators.
          ./gradlew assembleRelease --console=plain \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=kinevault-track \
            -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_PASSWORD"
      - name: Check and rename the .apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          expected=$(keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" -alias kinevault-track -storepass "$ANDROID_KEYSTORE_PASSWORD" | sha256sum | cut -d' ' -f1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          rm -f "$RUNNER_TEMP/release.jks"
          if ! grep -q "SHA-256 digest: $expected" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::The .apk isn't signed with the release keystore."
            exit 1
          fi
          # The Supabase URL is a string literal in the Hermes bundle. If it's
          # missing, the bundle task didn't see the environment.
          if ! unzip -p "$apk" assets/index.android.bundle | grep -qaF "$EXPO_PUBLIC_SUPABASE_URL"; then
            echo "::error::EXPO_PUBLIC_SUPABASE_URL is not in index.android.bundle."
            exit 1
          fi
          mkdir -p out
          mv "$apk" out/KineVaultTrack.apk
          ls -l out/KineVaultTrack.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: KineVaultTrack-apk
          path: out/KineVaultTrack.apk
          if-no-files-found: error
          # An .apk is already a zip file.
          compression-level: 0
          retention-days: 7
